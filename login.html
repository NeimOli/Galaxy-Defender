<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Authentication | Galaxy Defender</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>

    <header class="top-navbar" style="max-width: 460px; width: 95%; margin: 16px auto 0;">
        <a href="index.html" class="brand-section">
            <div class="brand-logo-icon">🚀</div>
            <div>
                <div class="brand-title" style="font-size: 16px;">Galaxy Defender</div>
                <div class="brand-subtitle">Virtual Identity Gateway</div>
            </div>
        </a>
        <a href="index.html" class="btn btn-secondary" style="padding: 6px 14px; font-size: 10px;">
            ← Return to Game
        </a>
    </header>

    <main class="auth-container">
        <div class="auth-header">
            <div style="font-size: 32px; margin-bottom: 6px;">🪪</div>
            <h1 class="auth-title">PILOT LOGIN</h1>
            <p style="font-size: 12px; color: var(--text-secondary);">
                Authenticate your virtual credentials to access career leaderboards and flight records.
            </p>
        </div>

        <!-- Connection Mode Indicator -->
        <div id="backendStatusPill" style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 12px; border-radius: var(--radius-pill); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-card); color: var(--text-primary); margin: 0 auto 18px;">
            <span class="loader-spinner" style="width: 10px; height: 10px;"></span> Checking Mainframe Status...
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="username">Pilot Callsign / Username</label>
                <input type="text" id="username" class="form-input" placeholder="e.g. shepard or fox" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Security Passcode</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnSubmitLogin" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 12px; margin-top: 6px;">
                🚀 AUTHORIZE ACCESS
            </button>

            <!-- Quick Demo Credentials Selector for Tutors & Evaluators -->
            <div style="margin-top: 16px; padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border-card); border-radius: var(--radius-sm); text-align: center;">
                <div style="font-size: 10px; font-family: var(--font-heading); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">
                    ⚡ One-Click Demo Credentials (Tutor Test)
                </div>
                <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
                    <button type="button" class="btn btn-secondary" style="font-size: 9px; padding: 5px 10px;" onclick="fillDemo('shepard')">👨‍🚀 Shepard (Admiral)</button>
                    <button type="button" class="btn btn-secondary" style="font-size: 9px; padding: 5px 10px;" onclick="fillDemo('fox')">🦊 Star Fox</button>
                    <button type="button" class="btn btn-secondary" style="font-size: 9px; padding: 5px 10px;" onclick="fillDemo('valkyrie')">⚡ Valkyrie</button>
                </div>
            </div>

            <div id="authStatusMsg" class="auth-status-msg"></div>

            <div style="margin-top: 18px; text-align: center; font-size: 12px; color: var(--text-secondary);">
                Unregistered pilot? 
                <a href="register.html" style="color: var(--cyan-primary); text-decoration: none; font-weight: 600;">Commission New Pilot →</a>
            </div>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script>
        function fillDemo(user) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = 'Password123!';
            const statusMsg = document.getElementById('authStatusMsg');
            statusMsg.style.color = 'var(--gold-primary)';
            statusMsg.textContent = `Demo credentials loaded for ${user}. Click Authorize.`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const statusPill = document.getElementById('backendStatusPill');
            const isLive = await API.checkBackendStatus();
            if (isLive) {
                statusPill.innerHTML = '<span style="color: var(--emerald-primary);">●</span> Server Mode: Live MySQL Mainframe';
                statusPill.style.borderColor = 'rgba(16, 185, 129, 0.4)';
            } else {
                statusPill.innerHTML = '<span style="color: var(--gold-primary);">●</span> Standalone Mode: Virtual Browser DB';
                statusPill.style.borderColor = 'rgba(255, 183, 3, 0.4)';
            }

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnSubmitLogin');
                const statusMsg = document.getElementById('authStatusMsg');
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                btn.disabled = true;
                btn.innerHTML = '<div class="loader-spinner"></div> Authenticating...';
                statusMsg.textContent = '';

                const result = await API.login(username, password);

                if (result.success) {
                    statusMsg.style.color = 'var(--emerald-primary)';
                    statusMsg.textContent = `Welcome aboard, ${result.user.callsign}! Redirecting to hangar...`;
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    statusMsg.style.color = 'var(--crimson-primary)';
                    statusMsg.textContent = result.message || 'Authorization failed. Check credentials.';
                    btn.disabled = false;
                    btn.innerHTML = '🚀 AUTHORIZE ACCESS';
                }
            });
        });
    </script>
</body>
</html>
